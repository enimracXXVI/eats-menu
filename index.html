<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>eats Tab</title>
  <meta name="description" content="Track what you buy at the work canteen against your daily allowance." />
  <meta name="theme-color" content="#d2622c" />
  <link rel="manifest" href="manifest.json" />
  <link rel="icon" type="image/png" sizes="32x32" href="assets/icons/favicon-32.png" />
  <link rel="icon" type="image/png" sizes="16x16" href="assets/icons/favicon-16.png" />
  <link rel="apple-touch-icon" href="assets/icons/icon-192.png" />
  <!-- Safari doesn't read manifest.json for home-screen behavior — these
       are its own separate mechanism for the same standalone/icon/title
       effect on iOS. -->
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="eats Tab" />
  <!-- ?v= is bumped by hand whenever CSS changes — GitHub Pages doesn't
       cache-bust these on its own, and a browser that cached an old copy
       before a deploy has no other reason to ever ask for a fresh one. -->
  <link rel="stylesheet" href="css/tokens.css?v=2" />
  <link rel="stylesheet" href="css/base.css?v=2" />
  <link rel="stylesheet" href="css/components.css?v=4" />
  <link rel="stylesheet" href="css/layout.css?v=2" />
</head>
<body>
  <div id="app"></div>
  <script type="module" src="js/app.js"></script>
</body>
</html>
